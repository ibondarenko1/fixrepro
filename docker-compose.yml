services:
  fixrepro:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FIXREPRO_CONTAINER_MODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 20s
