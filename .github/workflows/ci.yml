name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev,physical]"
      - name: Validate repository phases
        run: |
          python scripts/validate_scaffold.py
          python scripts/validate_phase2.py
          python scripts/validate_phase3.py
          python scripts/validate_phase4.py
          python scripts/validate_phase5.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall fixrepro_core device targets verifier app physical_witness scripts
      - name: Verify tracked demo bundle
        run: |
          python scripts/verify_bundle.py evidence/demo-bundle
          python -c "from pathlib import Path; expected='10fd80148896935b10fd1ccfd056e345d9a4537dff35473c4a025b9dbcab0204  manifest.json'; actual=Path('evidence/demo-bundle/manifest.sha256').read_text(encoding='utf-8').strip(); assert actual == expected, f'unexpected demo digest: {actual}'"
      - name: Validate optional physical-witness policy without network access
        run: python scripts/roomba_witness.py --bundle evidence/demo-bundle --dry-run
      - name: Run Phase 2 demonstration
        run: python scripts/run_phase2_demo.py
      - name: Run Phase 3 verification
        run: python scripts/run_verification.py
      - name: Run Phase 4 dashboard smoke test
        run: python scripts/run_phase4_smoke.py
      - name: Check whitespace
        run: git diff --check

  docker:
    name: docker
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev,physical]"
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build image
        run: docker compose build
      - name: Start container
        run: docker compose up -d
      - name: Wait for healthy container
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time

          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              container_id = subprocess.run(
                  ["docker", "compose", "ps", "-q", "fixrepro"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
              if container_id:
                  state = json.loads(
                      subprocess.run(
                          ["docker", "inspect", container_id],
                          check=True,
                          capture_output=True,
                          text=True,
                      ).stdout
                  )[0]["State"]
                  if state.get("Health", {}).get("Status") == "healthy":
                      raise SystemExit(0)
                  if state.get("Status") == "exited":
                      raise SystemExit("FixRepro container exited before becoming healthy")
              time.sleep(2)
          raise SystemExit("FixRepro container did not become healthy within 90 seconds")
          PY
      - name: Confirm published port boundary
        run: |
          python - <<'PY'
          import json
          import subprocess

          container_id = subprocess.run(
              ["docker", "compose", "ps", "-q", "fixrepro"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          ports = json.loads(
              subprocess.run(
                  ["docker", "inspect", container_id],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
          )[0]["NetworkSettings"]["Ports"]
          expected = {"8000/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8000"}]}
          if ports != expected:
              raise SystemExit(f"unexpected published ports: {ports}")
          for child_port in ("8101/tcp", "8102/tcp", "8200/tcp"):
              if child_port in ports:
                  raise SystemExit(f"child lab port was published: {child_port}")
          PY
      - name: Run container dashboard smoke test
        run: python scripts/run_phase4_smoke.py --base-url http://127.0.0.1:8000 --external-server
      - name: Show container status
        if: always()
        run: docker compose ps
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans
